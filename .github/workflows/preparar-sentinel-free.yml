name: Preparar Sentinel Free
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/preparar-sentinel-free.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preparar-free:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o repositório
        uses: actions/checkout@v4
      - name: Extrair Free e aplicar correções
        run: python3 tools/build_free_from_crx.py
      - name: Publicar arquivos na branch main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "release: publicar Sentinel Web Security Free v0.1.5"
            git push origin HEAD:main
          fi
